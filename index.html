<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math - Web Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .doorway-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        /* Changes to 2 columns on larger screens */
        @media (min-width: 480px) {
            .doorway-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .door-link {
            display: block;
            padding: 20px;
            background-color: #ffffff;
            color: #2980b9;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
            border: 1px solid #e2e8f0;
        }

        .door-link:hover {
            background-color: #2980b9;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(41, 128, 185, 0.2);
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Welcome</h1>
            <p>Select a destination below to get started with</p>
        </header>

        <main class="doorway-grid">
            <a href="Geometry/dse_locus.html" target="_blank" class="door-link">Locus Simulator</a>
            <a href="Geometry/parallel_and_perpendicular.html" target="_blank" class="door-link">Parallel & Perpendicular</a>
        </main>

        <footer>
            <p>&copy; 2026 by Alvin Chan</p>
        </footer>
    </div>

</body>
</html>
